<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#tiaGrad)" filter="url(#glow)"/>

  <!-- Robot Head Outline -->
  <rect x="32" y="38" width="64" height="52" rx="14" fill="#0f172a" stroke="#ffffff" stroke-width="4" />

  <!-- Antenna -->
  <line x1="64" y1="20" x2="64" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <circle cx="64" cy="18" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />

  <!-- Robot Ears -->
  <rect x="22" y="52" width="10" height="24" rx="4" fill="#38bdf8" />
  <rect x="96" y="52" width="10" height="24" rx="4" fill="#38bdf8" />

  <!-- Eyes (Glowing Cyan) -->
  <circle cx="48" cy="58" r="9" fill="#06b6d4" />
  <circle cx="48" cy="58" r="4" fill="#ffffff" />
  <circle cx="80" cy="58" r="9" fill="#06b6d4" />
  <circle cx="80" cy="58" r="4" fill="#ffffff" />

  <!-- Smile / Interface Grid -->
  <rect x="46" y="74" width="36" height="7" rx="3.5" fill="#10b981" />
</svg>
